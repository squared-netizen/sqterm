# sqterm's packages (12.5): built here, added to the GitHub release named
# `packages`, downloaded on the phone by tools/fetch_packages.sh, a
# deliberate step (decided 2026-11-04). The build itself is offline, here as
# on the phone: the sources are fetched first, then packages/build.sh runs.
#
# Each package has its own key (`bash packages/build.sh --keys`: its recipe,
# what it depends on, the API level), and its archive is
# <name>-<version>-<key>.tar.zst in the release. Only packages whose archive
# is missing are built: a recipe changed rebuilds that package and what
# depends on it. Finished builds are kept in the Actions cache, so a package
# that is up to date is not built again to serve one that depends on it.
# A pull request builds and keeps the result as an artifact; only main (or a
# run started by hand on main) adds to the release.
name: packages

on:
  push:
    branches: [main]
    paths:
      # Every file a package's key covers: the recipes, and each recipe's
      # `inputs` outside packages/ (pkg's sources, ncurses' terminfo entry).
      # A key that changes with no run here leaves the release without the
      # archive fetch_packages.sh asks for.
      - packages/**
      - terminfo/sqterm.ti
      - sq_app/pkg/**
      - sq_app/cli/**
      - sq_app/src/unpack.cpp
      - sq_app/src/unpack.hpp
      - sq_app/src/unpack_cartridge.cpp
      - SQUARED_REV
      - squared/build/squared.lua
      - squared/build/toolchain.lua
      - squared/console/client/sqconsole.cpp
      - squared/third_party/zstd/**
      - squared/third_party/yyjson/**
      # The cartridges' packer (not in any key: it packs the same installs).
      - third_party/sqcart/**
      - tools/cartridge/**
      - tools/pack_cartridges.sh
      - .github/workflows/packages.yml
  pull_request:
    paths:  # the same list as push
      - packages/**
      - terminfo/sqterm.ti
      - sq_app/pkg/**
      - sq_app/cli/**
      - sq_app/src/unpack.cpp
      - sq_app/src/unpack.hpp
      - sq_app/src/unpack_cartridge.cpp
      - SQUARED_REV
      - squared/build/squared.lua
      - squared/build/toolchain.lua
      - squared/console/client/sqconsole.cpp
      - squared/third_party/zstd/**
      - squared/third_party/yyjson/**
      # The cartridges' packer (not in any key: it packs the same installs).
      - third_party/sqcart/**
      - tools/cartridge/**
      - tools/pack_cartridges.sh
      - .github/workflows/packages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  # The NDK the phone builds with ($PREFIX/opt/android-sdk/ndk/<version>).
  NDK_VERSION: 29.0.14206865
  RELEASE: packages

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Which archives the release lacks
        id: plan
        run: |
          bash packages/build.sh --keys | tee keys.txt
          gh release view "$RELEASE" --json assets --jq '.assets[].name' > have.txt 2>/dev/null || : > have.txt
          missing=
          have() { local line; while IFS= read -r line; do [ "$line" = "$1" ] && return 0; done < have.txt; return 1; }
          # Each package as a tarball and, since 2026-11-19, as a cartridge.
          while read -r name version key bundled; do
            { have "$name-$version-$key.tar.zst" && have "$name-$version-$key.sq"; } ||
              missing="$missing $name"
          done < keys.txt
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          echo "to build:${missing:- nothing}"

      - name: The NDK, its clang first on PATH
        if: steps.plan.outputs.missing != ''
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          ndk=$ANDROID_HOME/ndk/$NDK_VERSION
          test -d "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Room on the disk (LLVM's build needs several GB)
        if: contains(steps.plan.outputs.missing, 'llvm') || contains(steps.plan.outputs.missing, 'lldb')
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Tools
        if: steps.plan.outputs.missing != ''
        run: sudo apt-get install -y --no-install-recommends zstd xz-utils cmake ninja-build ccache

      - name: clang 23 for this machine (the runtimes, lldb, sqdrive and the cartridges' packer; the NDK's clang is 21)
        if: steps.plan.outputs.missing != ''
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang-23 lld-23 llvm-23 libc++-23-dev libc++abi-23-dev
          /usr/lib/llvm-23/bin/clang --version | head -n 1

      # sqmake and sqedit for this machine, at the tags their recipes pin:
      # sqmake bootstrapped (no make); it builds sqedit (the recipes' and
      # build.sh's text work), pkg (packages/pkg/build.lua) and the
      # cartridges' packer (tools/cartridge/build.lua).
      - name: sqmake and sqedit for this machine
        if: steps.plan.outputs.missing != ''
        run: |
          set -euo pipefail
          llvm=/usr/lib/llvm-23/bin
          for name in sqmake sqedit; do
            tag=$(bash -c ". packages/$name/recipe.sh; echo v\$version")
            git clone --quiet --depth 1 --branch "$tag" "https://github.com/squared-netizen/$name" "$RUNNER_TEMP/$name"
          done
          (cd "$RUNNER_TEMP/sqmake" && CXX=$llvm/clang++ CC=$llvm/clang AR=$llvm/llvm-ar sh tools/bootstrap.sh)
          CXX=$llvm/clang++ CC=$llvm/clang "$RUNNER_TEMP/sqmake/build/sqmake" -C "$RUNNER_TEMP/sqedit" -j4 build/sqedit
          echo "$RUNNER_TEMP/sqedit/build" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/sqmake/build" >> "$GITHUB_PATH"

      - name: Compiler cache (kept even when a run fails)
        if: steps.plan.outputs.missing != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Sources, kept between runs
        if: steps.plan.outputs.missing != ''
        uses: actions/cache@v4
        with:
          path: build/packages/sources
          key: package-sources-${{ hashFiles('packages/*/recipe.sh', 'packages/sources.lock') }}
          restore-keys: package-sources-

      - name: Finished builds, kept between runs (saved even when a run fails)
        if: steps.plan.outputs.missing != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            build/packages/*/key
            build/packages/*/dest
            build/packages/extra
            sq_android/assets/packages
          key: package-builds-${{ github.run_id }}
          restore-keys: package-builds-

      - name: Sources
        if: steps.plan.outputs.missing != ''
        env:
          # On main a source with no sha256 anywhere fails: only what is
          # recorded in packages/sources.lock is built and published. Any
          # other branch records the first download of a new source (GNU
          # publishes no sha256), prints it, and fails after the build: the
          # line is committed to that branch, where it is reviewed.
          SQ_LOCKED: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          cp packages/sources.lock "$RUNNER_TEMP/sources.lock.before"
          bash tools/fetch_packages.sh --sources
          # New lines: reported now, before hours of building with them.
          if ! cmp -s "$RUNNER_TEMP/sources.lock.before" packages/sources.lock; then
            echo "packages/sources.lock gained lines; commit them to this branch:"
            diff "$RUNNER_TEMP/sources.lock.before" packages/sources.lock |
              while IFS= read -r line; do case $line in '> '*) echo "${line#> }" ;; esac; done
            exit 1
          fi

      - name: Build (offline; up-to-date packages are skipped)
        if: steps.plan.outputs.missing != ''
        env:
          CC_FOR_BUILD: gcc
          CXX_FOR_BUILD: g++
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          clang --version | head -n 1
          bash packages/build.sh

      # Packed afresh on every run (a minute), not cached: a cache is tied
      # to its exact list of paths, and a path added to the builds' cache
      # would miss every cache before it, and rebuild everything (llvm:
      # hours).
      - name: Each package as a cartridge too (offline)
        if: steps.plan.outputs.missing != ''
        run: bash tools/pack_cartridges.sh

      - name: Save the finished builds
        if: always() && steps.plan.outputs.missing != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/packages/*/key
            build/packages/*/dest
            build/packages/extra
            sq_android/assets/packages
          key: package-builds-${{ github.run_id }}

      - name: Save the compiler cache
        if: always() && steps.plan.outputs.missing != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.run_id }}

      - name: The build logs, when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/packages/*/build.log
          if-no-files-found: ignore

      - name: The archives the release lacks
        if: steps.plan.outputs.missing != ''
        run: |
          mkdir dist
          have() { local line; while IFS= read -r line; do [ "$line" = "$1" ] && return 0; done < have.txt; return 1; }
          while read -r name version key bundled; do
            asset=$name-$version-$key.tar.zst
            if ! have "$asset"; then
              from=sq_android/assets/packages
              [ "$bundled" = no ] && from=build/packages/extra
              cp "$from/$name-$version.tar.zst" "dist/$asset"
              ( cd dist && sha256sum "$asset" > "$asset.sha256" && cat "$asset.sha256" )
            fi
            cartridge=$name-$version-$key.sq
            if ! have "$cartridge"; then
              cp "build/packages/cartridges/$name-$version.sq" "dist/$cartridge"
              ( cd dist && sha256sum "$cartridge" > "$cartridge.sha256" && cat "$cartridge.sha256" )
            fi
          done < keys.txt

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.missing != ''
        with:
          name: packages
          path: dist/

      - name: Add them to the release
        if: steps.plan.outputs.missing != '' && github.ref == 'refs/heads/main'
        run: |
          gh release view "$RELEASE" > /dev/null 2>&1 ||
            gh release create "$RELEASE" --target "$GITHUB_SHA" --title "sqterm packages" \
              --notes "Every package CI has built, one archive per key: <name>-<version>-<key>.tar.zst, with its .sha256. On the phone, in sqterm's folder: tools/fetch_packages.sh"
          gh release upload "$RELEASE" dist/*

      # What pkg reads (pkg update, upgrade, install NAME): for each package
      # main's recipes ask for, its version, key, whether the APK carries it,
      # its archive's sha256 and what it needs at run time (packages/needs),
      # in build order. Written on every run on
      # main, also when nothing was built: a recipe changed back to an
      # earlier key needs no build, only this. Replaced in place (--clobber);
      # tools/prune_release.sh keeps it.
      - name: The release's index, for pkg
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p shas
          {
            echo "sqterm release index 2"
            while read -r name version key bundled; do
              asset=$name-$version-$key.tar.zst
              if [ -f "dist/$asset.sha256" ]; then
                cp "dist/$asset.sha256" shas/
              else
                gh release download "$RELEASE" -p "$asset.sha256" -D shas --clobber
              fi
              sha=$(cut -d ' ' -f 1 "shas/$asset.sha256")
              [ ${#sha} -eq 64 ] || { echo "no sha256 for $asset" >&2; exit 1; }
              needs=$(while read -r n rest; do if [ "$n" = "$name:" ]; then read -r -a w <<< "$rest"; (IFS=,; echo "${w[*]}"); fi; done < packages/needs)
              echo "$name $version $key $bundled $sha ${needs:--}"
            done < keys.txt
          } > index
          cat index
          # The same for the cartridges: index-3, which the pkg that reads
          # .sq takes (the pkg already on phones reads `index`, the tarballs).
          {
            echo "sqterm release index 3"
            while read -r name version key bundled; do
              asset=$name-$version-$key.sq
              if [ -f "dist/$asset.sha256" ]; then
                cp "dist/$asset.sha256" shas/
              else
                gh release download "$RELEASE" -p "$asset.sha256" -D shas --clobber
              fi
              sha=$(cut -d ' ' -f 1 "shas/$asset.sha256")
              [ ${#sha} -eq 64 ] || { echo "no sha256 for $asset" >&2; exit 1; }
              needs=$(while read -r n rest; do if [ "$n" = "$name:" ]; then read -r -a w <<< "$rest"; (IFS=,; echo "${w[*]}"); fi; done < packages/needs)
              echo "$name $version $key $bundled $sha ${needs:--}"
            done < keys.txt
          } > index-3
          cat index-3
          gh release upload "$RELEASE" index index-3 --clobber
